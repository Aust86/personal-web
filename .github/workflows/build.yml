name: Build and Zip Astro Project

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch: # Enables manual triggering from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # Or whatever version you use locally, or 'latest'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm' # Important: tells GitHub to cache pnpm dependencies

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro project
        run: pnpm run build

      - name: Zip build output
        run: zip -r build-artifact.zip dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-build-zip
          path: build-artifact.zip
