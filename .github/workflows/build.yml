name: Build and Zip Astro Project

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # ⚠️ DO NOT put cache: 'pnpm' here. It causes the "packages field missing or empty" crash.

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # Change to 8 or 10 if your project requires a specific version
          cache: true # ✅ Let pnpm's official action handle the caching safely

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro project
        run: pnpm run build

      - name: Zip build output
        run: zip -r build-artifact.zip dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-build-zip
          path: build-artifact.zip
