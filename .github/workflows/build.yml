name: Build and Zip Astro Project

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Install pnpm globally using npm (bypasses the pnpm/action-setup cache bug)
      - name: Install pnpm
        run: npm install -g pnpm@9

      # 2. Setup Node.js and let IT handle the pnpm caching natively
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm' # ✅ This now works perfectly because pnpm is in the PATH and pnpm-workspace.yaml is fixed

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro project
        run: pnpm run build

      - name: Zip build output
        run: zip -r build-artifact.zip dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-build-zip
          path: build-artifact.zip
