name: Build and Zip Astro Project

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Install pnpm FIRST so setup-node can find it for caching
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # Replace with the pnpm version your project uses (e.g., 8, 9, or 10)

      # 2. Now setup-node will successfully locate pnpm and configure the cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro project
        run: pnpm run build

      - name: Zip build output
        run: zip -r build-artifact.zip dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-build-zip
          path: build-artifact.zip
